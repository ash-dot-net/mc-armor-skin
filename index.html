<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skin Armorizer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <div>
        <h1>
          Skin Armorizer
        </h1>
        <p class="tagline">
          Bake armor and trim onto a Minecraft skin. Makes an elytra still look like a full set of armor.
        </p>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button">
        Light / Dark
      </button>
    </header>
    <div class="layout">
      <!-- Inputs -->
      <section class="column">
        <p class="section-label">Source</p>
        <label class="control">
          Skin file
          <input type="file" id="skin-input" accept="image/png">
        </label>
        <p class="section-label">Equipment</p>
        <div id="controls" class="column">
          <!-- filled in by ui.js -->
        </div>
      </section>
      <!-- Outputs -->
      <section class="column">
        <p class="section-label">Result</p>
        <div class="outputs">
          <div class="output-card">
            <canvas id="preview"></canvas>
          </div>
          <div class="output-card">
            <div class="texture-frame">
              <canvas id="out" width="64" height="64"></canvas>
            </div>
            <button id="download-button" type="button">Download skin</button>
          </div>
          <div class="output-card">
            <fieldset class="view-options">
              <legend>View</legend>
              <label><input type="checkbox" id="elytra-toggle"> Elytra</label>
              <label><input type="checkbox" id="outer-layer-toggle" checked> Skin's outer layer</label>
              <label><input type="checkbox" id="grid-toggle"> Texture grid</label>
            </fieldset>
          </div>
        </div>
      </section>
    </div>

    <script src="vendor/skinview3d.bundle.js"></script>
    <script type="module" src="src/theme.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
