<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Armorizer!</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Skin Armorizer!</h1>
    <div class="layout">
      <!-- Settings -->
      <section class="panel">
        <label class="control">
          Skin file
          <input type="file" id="skin-input" accept="image/png">
        </label>
        <div id="controls">
          <!-- filled in by ui.js -->
        </div>
      </section>
      <!-- Output texture -->
      <section class="panel">
        <canvas id="out" width="64" height="64"></canvas>
        <button id="download-button" type="button">Download skin</button>
      </section>
      <!-- 3d preview -->
      <section class="panel">
        <canvas id="preview"></canvas>
        <fieldset class="preview-controls">
          <legend>Preview</legend>
          <label><input type="checkbox", id="elytra-toggle"> Elytra</label>
          <label><input type="checkbox", id="outer-layer-toggle"> Show skin's outer layer</label>
        </fieldset>
      </section>
    </div>

    <script src="vendor/skinview3d.bundle.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
